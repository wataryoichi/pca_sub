# Base configuration for PCA_SUB project
data:
  provider: yfinance
  start_date: "2010-01-01"
  end_date: "2025-12-31"
  raw_dir: data/raw
  interim_dir: data/interim
  processed_dir: data/processed

strategy:
  window_length: 60          # L: rolling window for standardization
  lambda_reg: 0.9            # λ: regularization strength
  n_components: 3            # K: number of principal components
  quantile: 0.3              # q: top/bottom quantile for long/short
  prior_dim: 3               # K0: prior subspace dimension

cfull:
  start_date: "2010-01-01"
  end_date: "2014-12-31"
  mode: fixed                # fixed / rolling / expanding

backtest:
  start_date: "2015-01-01"
  end_date: "2025-12-31"

cost:
  enabled: false
  one_way_bps: 10
  short_extra_bps: 5
  illiquid_extra_bps: 5

liquidity:
  enabled: false
  min_avg_turnover_jpy: 100_000_000
  lookback_days: 20

output:
  results_dir: results
  reports_dir: reports
  plots_format: png
